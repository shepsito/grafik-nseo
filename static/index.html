<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>График НСЕО</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:#0b0b13; color:#eee; font-family:system-ui; margin:0; padding:10px; }
    h2 { margin-top:20px; }
    .card { background:#1a1a24; padding:10px; margin:8px 0; border-radius:8px; }
    .title { font-weight:bold; }
    .small { color:#aaa; font-size:0.9em; }
  </style>
</head>
<body>

  <!-- Минали събития най-горе -->
  <h2>МИНАЛИ</h2>
  <div id="past"></div>

  <!-- Днес -->
  <h2>ДНЕС</h2>
  <div id="today"></div>

  <!-- Следващи -->
  <h2>СЛЕДВАЩИ</h2>
  <div id="next"></div>

  <script>
    // Форматиране на дата: "25 юли, 07:00"
    function formatBG(dateString) {
      const d = new Date(dateString);
      const day = d.getDate();
      const months = ["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
      const month = months[d.getMonth()];
      const hours = String(d.getHours()).padStart(2, "0");
      const minutes = String(d.getMinutes()).padStart(2, "0");
      return `${day} ${month}, ${hours}:${minutes}`;
    }

    // HTML цвят вместо BBCode
    function colorHTML(text) {
      return text.replace(/

\[color=(#[0-9a-fA-F]{6}|[0-9a-fA-F]{6})\]

(.*?)

\[\/color\]

/g,
        '<span style="color:$1;">$2</span>');
    }

    async function loadToday() {
      const res = await fetch("/api/events/today");
      const data = await res.json();
      const box = document.getElementById("today");
      box.innerHTML = "";
      if (!data.length) {
        box.innerHTML = "<div class='small'>Няма събития за днес</div>";
        return;
      }
      data.forEach(ev => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="title">${colorHTML(ev.title)}</div>
          <div class="small">${formatBG(ev.datetime)} | ${ev.shift} | ${ev.facility}</div>
          <div class="small">${colorHTML(ev.description)}</div>
        `;
        box.appendChild(div);
      });
    }

    async function loadNext() {
      const res = await fetch("/api/events/next");
      const data = await res.json();
      const box = document.getElementById("next");
      box.innerHTML = "";
      if (!data.length) {
        box.innerHTML = "<div class='small'>Няма предстоящи събития</div>";
        return;
      }
      data.forEach(ev => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="title">${colorHTML(ev.title)}</div>
          <div class="small">${formatBG(ev.datetime)} | ${ev.shift} | ${ev.facility}</div>
          <div class="small">${colorHTML(ev.description)}</div>
        `;
        box.appendChild(div);
      });
    }

    async function loadPast() {
      const resToday = await fetch("/api/events/today");
      const resNext = await fetch("/api/events/next");

      const today = await resToday.json();
      const next = await resNext.json();

      const all = [...today, ...next];

      const box = document.getElementById("past");
      box.innerHTML = "";

      const now = new Date();
      const past = all.filter(ev => new Date(ev.datetime) < now);

      if (!past.length) {
        box.innerHTML = "<div class='small'>Няма минали събития</div>";
        return;
      }

      past.slice(-10).forEach(ev => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="title">${colorHTML(ev.title)}</div>
          <div class="small">${formatBG(ev.datetime)} | ${ev.shift} | ${ev.facility}</div>
          <div class="small">${colorHTML(ev.description)}</div>
        `;
        box.appendChild(div);
      });
    }

    loadPast();
    loadToday();
    loadNext();

    setInterval(() => {
      loadPast();
      loadToday();
      loadNext();
    }, 60000);
  </script>
</body>
</html>
