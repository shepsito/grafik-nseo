<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>График НСЕО</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:#0b0b13; color:#eee; font-family:system-ui; margin:0; padding:10px; }
    h2 { margin-top:20px; color: #aaa; font-size: 1.2em; letter-spacing: 2px; }
    .card { background:#1a1a24; padding:10px; margin:8px 0; border-radius:8px; border-left: 3px solid #444; }
    .card:hover { background:#222233; }
    .title { font-weight:bold; color: #fff; }
    .small { color:#aaa; font-size:0.9em; }
    .shift-1 { border-left-color: #ff6b6b; }
    .shift-2 { border-left-color: #4ecdc4; }
    .shift-3 { border-left-color: #ffe66d; }
    .empty { color: #555; font-style: italic; padding: 15px 10px; }
    .debug { background: #1a1a2e; color: #0f0; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>

  <h2>📅 МИНАЛИ</h2>
  <div id="past"></div>

  <h2>📅 ДНЕС</h2>
  <div id="today"></div>

  <h2>📅 СЛЕДВАЩИ</h2>
  <div id="next"></div>

  <!-- Дебъг панел -->
  <h2>🐛 ДЕБЪГ</h2>
  <div id="debug" class="debug"></div>

  <script>
    // Функция за конвертиране на BBCode
    function parseBBCode(text) {
      if (!text) return '';
      return text.replace(/\[color=([0-9a-fA-F]{6})\](.*?)\[\/color\]/g, function(match, color, content) {
        return `<span style="color: #${color}">${content}</span>`;
      });
    }

    // Функция за дебъг
    function debugLog(message) {
      const debugDiv = document.getElementById('debug');
      debugDiv.innerHTML += message + '\n';
      debugDiv.scrollTop = debugDiv.scrollHeight;
    }

    // Форматиране на дата
    function formatBG(dateString) {
      const d = new Date(dateString);
      const day = d.getDate();
      const months = ["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
      const month = months[d.getMonth()];
      const hours = String(d.getHours()).padStart(2, "0");
      const minutes = String(d.getMinutes()).padStart(2, "0");
      return `${day} ${month}, ${hours}:${minutes}`;
    }

    function getShiftClass(shift) {
      if (shift.includes('Смяна 1')) return 'shift-1';
      if (shift.includes('Смяна 2')) return 'shift-2';
      if (shift.includes('Смяна 3')) return 'shift-3';
      return '';
    }

    function renderEvent(ev) {
      const div = document.createElement("div");
      const shiftClass = getShiftClass(ev.shift);
      div.className = `card ${shiftClass}`;
      
      const titleHtml = parseBBCode(ev.title);
      const descHtml = parseBBCode(ev.description || '');
      
      div.innerHTML = `
        <div class="title">${titleHtml}</div>
        <div class="small">${formatBG(ev.datetime)} | ${ev.shift} | ${ev.facility}</div>
        <div class="small">${descHtml}</div>
      `;
      return div;
    }

    async function loadToday() {
      try {
        debugLog('🔄 Зареждане на днешни събития...');
        const res = await fetch("/api/events/today");
        const data = await res.json();
        
        debugLog(`📥 Получени ${data.length} събития за днес`);
        
        const box = document.getElementById("today");
        box.innerHTML = "";
        
        if (!data || !data.length) {
          box.innerHTML = "<div class='empty'>Няма събития за днес</div>";
          return;
        }
        
        data.forEach((ev, index) => {
          debugLog(`  ${index+1}. ${ev.title} - ${ev.datetime} - ${ev.shift}`);
          box.appendChild(renderEvent(ev));
        });
      } catch (error) {
        console.error('Грешка:', error);
        debugLog(`❌ ГРЕШКА: ${error.message}`);
        document.getElementById("today").innerHTML = "<div class='empty'>Грешка при зареждане</div>";
      }
    }

    async function loadNext() {
      try {
        const res = await fetch("/api/events/next");
        const data = await res.json();
        const box = document.getElementById("next");
        box.innerHTML = "";
        if (!data || !data.length) {
          box.innerHTML = "<div class='empty'>Няма предстоящи събития</div>";
          return;
        }
        data.forEach(ev => {
          box.appendChild(renderEvent(ev));
        });
      } catch (error) {
        console.error('Грешка:', error);
        document.getElementById("next").innerHTML = "<div class='empty'>Грешка при зареждане</div>";
      }
    }

    async function loadPast() {
      try {
        const res = await fetch("/api/events/past");
        const data = await res.json();
        const box = document.getElementById("past");
        box.innerHTML = "";
        if (!data || !data.length) {
          box.innerHTML = "<div class='empty'>Няма минали събития</div>";
          return;
        }
        data.forEach(ev => {
          box.appendChild(renderEvent(ev));
        });
      } catch (error) {
        console.error('Грешка:', error);
        document.getElementById("past").innerHTML = "<div class='empty'>Грешка при зареждане</div>";
      }
    }

    // Изчистваме дебъг и зареждаме
    document.getElementById('debug').innerHTML = '🐛 ДЕБЪГ ЛОГ:\n';
    debugLog('🚀 Стартиране на приложението...');
    debugLog(`📅 Текуща дата: ${new Date().toLocaleString()}`);
    
    loadPast();
    loadToday();
    loadNext();

    setInterval(() => {
      loadPast();
      loadToday();
      loadNext();
    }, 60000);
  </script>
</body>
</html>
